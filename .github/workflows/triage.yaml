# https://docs.github.com/en/actions

name: "Triage"

on: # yamllint disable-line rule:truthy
  # zizmor: ignore[dangerous-triggers] -- required to label pull requests from forks based on branch name
  pull_request_target:
    types:
      - "opened"

jobs:
  label:
    name: "Label"

    permissions:
      contents: "read"

    runs-on: "ubuntu-latest"

    timeout-minutes: 5

    steps:
      - name: "Add labels based on branch name"
        uses: "ergebnis/.github/actions/github/pull-request/add-label-based-on-branch-name@f5048b197f24b30496f4989821523d688959fbc3" # 1.13.1
        with:
          github-token: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"
