# https://docs.github.com/en/actions

name: "Merge"

on: # yamllint disable-line rule:truthy
  # zizmor: ignore[dangerous-triggers] -- required to auto-merge Dependabot pull requests after Integrate workflow completes
  workflow_run:
    types:
      - "completed"
    workflows:
      - "Integrate"

jobs:
  merge:
    name: "Merge"

    permissions:
      contents: "read"

    runs-on: "ubuntu-24.04"

    timeout-minutes: 5

    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' && (
        startsWith(github.event.workflow_run.head_commit.message, 'composer(deps-dev)') ||
        startsWith(github.event.workflow_run.head_commit.message, 'github-actions(deps)')
      )

    steps:
      - name: "Request review from @ergebnis-bot"
        uses: "ergebnis/.github/actions/github/pull-request/request-review@f5048b197f24b30496f4989821523d688959fbc3" # 1.13.1
        with:
          github-token: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"
          reviewer: "ergebnis-bot"

      - name: "Assign @ergebnis-bot"
        uses: "ergebnis/.github/actions/github/pull-request/add-assignee@f5048b197f24b30496f4989821523d688959fbc3" # 1.13.1
        with:
          assignee: "ergebnis-bot"
          github-token: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"

      - name: "Approve pull request"
        uses: "ergebnis/.github/actions/github/pull-request/approve@f5048b197f24b30496f4989821523d688959fbc3" # 1.13.1
        with:
          github-token: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"

      - name: "Merge pull request"
        uses: "ergebnis/.github/actions/github/pull-request/merge@f5048b197f24b30496f4989821523d688959fbc3" # 1.13.1
        with:
          github-token: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"
